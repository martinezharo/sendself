name: Android

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
  pull_request:
    paths:
      - "apps/android/**"
      - "android.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        if: github.event_name == 'pull_request'
        working-directory: apps/android
        run: ./gradlew assembleDebug lintDebug --no-daemon

      - name: Write upload key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"

      - name: Bundle release AAB
        if: github.event_name != 'pull_request'
        working-directory: apps/android
        env:
          SENDSELF_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          SENDSELF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SENDSELF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SENDSELF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sendself-${{ github.ref_name }}-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
