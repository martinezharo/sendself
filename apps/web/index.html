    <!-- prerender:landing-only:start -->
    <!-- Structured data: the application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SendSelf",
        "url": "https://file-sharer.4oli.com/",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any (progressive web app)",
        "image": "https://file-sharer.4oli.com/og.png",
        "description": "A private, end-to-end encrypted progressive web app for sharing text and files up to 50 MiB between your own devices. The server can deliver ciphertext but cannot decrypt your content.",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Encryption before upload (AES-GCM)",
          "No account required",
          "Cross-device sync",
          "QR-code device pairing",
          "Files up to 50 MiB",
          "Installable PWA with local history"
        ]
      }
    </script>

    <!-- Structured data: the brand -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SendSelf",
        "url": "https://file-sharer.4oli.com/",
        "logo": "https://file-sharer.4oli.com/icon-512.png"
      }
    </script>

    <!-- Structured data: FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is SendSelf end-to-end encrypted?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Messages, files, and file metadata are encrypted on your device with AES-GCM before upload. The server receives ciphertext and cannot decrypt the content."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No account, email, or server password is required. You can optionally protect this device with a passphrase, PIN, or passkey."
            }
          },
          {
            "@type": "Question",
            "name": "Can the server read my messages or files?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It cannot decrypt your content. It does receive ciphertext and the protocol metadata needed to authenticate requests and deliver messages."
            }
          },
          {
            "@type": "Question",
            "name": "What is the maximum file size?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can share files up to 50 MiB. The server copy is purged when active recipients acknowledge delivery; anything left over is cleaned up within 24 hours."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Partly. The installed PWA keeps local history available and can save outgoing messages or selected files locally, but nothing is uploaded or delivered until you reconnect."
            }
          },
          {
            "@type": "Question",
            "name": "How do I add another device?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On the new device, choose to link an existing space and show its QR code. Scan it from a linked device; the shared group key is transferred in an encrypted pairing package."
            }
          },
          {
            "@type": "Question",
            "name": "Where are the encryption keys kept?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Private device keys are generated locally and never sent to the server. The shared group key is transferred only to linked devices through encrypted pairing and key-rotation packages. An optional encrypted recovery file can carry a copy for restoring a device."
            }
          }
        ]
      }
    </script>
    <!-- prerender:landing-only:end -->
